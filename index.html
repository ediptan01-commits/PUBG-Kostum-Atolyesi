
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elite Savaşçı Atölyesi</title>
<style>
body {
  margin: 0;
  background: #101522;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
header {
  background: #222d42;
  padding: 20px 10px;
}
h1 { margin: 5px; font-size: 24px; }
p { color: #c2c9d8; }
#viewer {
  width: 100%;
  height: 58vh;
  min-height: 350px;
}
.controls { padding: 15px; }
button {
  background: #bb293b;
  border: 0;
  color: white;
  padding: 14px 18px;
  margin: 5px;
  border-radius: 10px;
  font-size: 16px;
}
button:active { background: #e04b5d; }
#status { color: #ffc85a; }
</style>
</head>
<body>
<header>
  <h1>⚔️ ELİT SAVAŞÇI</h1>
  <p>3D Asker Tasarım Atölyesi</p>
</header>

<div id="viewer"></div>
<p id="status">Asker modeli yükleniyor...</p>

<div class="controls">
  <h3>🎨 Zırh rengi</h3>
  <button onclick="changeColor(0x20252e)">Siyah</button>
  <button onclick="changeColor(0x9d2632)">Kırmızı</button>
  <button onclick="changeColor(0x1763a4)">Mavi</button>
  <button onclick="changeColor(0x9b8536)">Altın</button>
  <p>Parmağınla sürükleyerek döndür.</p>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { GLTFLoader } from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const container = document.getElementById('viewer');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101522);

const camera = new THREE.PerspectiveCamera(
  45, container.clientWidth / container.clientHeight, 0.1, 100
);
camera.position.set(0, 2, 5);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x39445b, 2));

const light = new THREE.DirectionalLight(0xffffff, 3);
light.position.set(3, 6, 5);
scene.add(light);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 1, 0);
controls.minDistance = 2;
controls.maxDistance = 8;

const floor = new THREE.Mesh(
  new THREE.CircleGeometry(2.5, 64),
  new THREE.MeshStandardMaterial({color:0x30394c})
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.03;
scene.add(floor);

let soldier = null;

const loader = new GLTFLoader();
loader.load(
  'https://threejs.org/examples/models/gltf/Soldier.glb',
  (gltf) => {
    soldier = gltf.scene;
    const box = new THREE.Box3().setFromObject(soldier);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    soldier.position.x -= center.x;
    soldier.position.z -= center.z;
    soldier.position.y -= box.min.y;

    const scale = 2.8 / size.y;
    soldier.scale.setScalar(scale);

    scene.add(soldier);
    controls.target.set(0, 1.3, 0);
    document.getElementById('status').textContent =
      'Asker hazır! Kostümünü tasarla.';
  },
  undefined,
  (error) => {
    document.getElementById('status').textContent =
      'Model yüklenemedi. İnternet bağlantını kontrol et.';
    console.error(error);
  }
);

window.changeColor = (color) => {
  if (!soldier) return;
  soldier.traverse((obj) => {
    if (!obj.isMesh || !obj.material) return;
    const mats = Array.isArray(obj.material)
      ? obj.material : [obj.material];
    mats.forEach((mat) => {
      if (mat.color) mat.color.setHex(color);
    });
  });
};

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});
</script>
</body>
</html>
